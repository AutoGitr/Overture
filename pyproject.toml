[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overture"]
# The ignored frontend build, when present, ships inside the package.
artifacts = ["src/overture/frontend/"]

[project.scripts]
overture = "overture.cli:main"

[project]
name = "overture"
version = "1.0.2"
description = "Artwork and theme manager for Plex, Jellyfin and Emby"
readme = ".github/README.md"
license = "AGPL-3.0-only"
authors = [{name = "Overture"}]
requires-python = "==3.15.1"

dependencies = [
    "aiosqlite==0.22.1",
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "authlib==1.9.1",
    "blake3==1.0.11",
    "fastapi==0.160.0",
    "httpx2==2.16.0",
    "joserfc==1.7.7",
    "jsonschema==4.26.0",
    "pillow==13.0.0",
    "pydantic-settings==2.16.1",
    "python-dotenv==1.2.4",
    "sqlalchemy[asyncio]==2.1.6",
    "sqlmodel==0.0.48",
    "tzdata==2026.5",
    "uvicorn[standard]==0.54.0",
    "yt-dlp[default]==2026.10.21",
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "types-jsonschema==4.26.0.20261006",
]

[tool.alembic]
script_location = "%(here)s/src/overture/migrations"

[tool.uv]
required-version = "0.13.5"
# brotli publishes no CPython 3.15 wheels yet and the slim image has no compiler;
# yt-dlp prefers brotlicffi, whose abi3 wheels cover 3.15.
override-dependencies = [
    "brotli; implementation_name != 'cpython'",
    "brotlicffi",
]

# PyYAML publishes no CPython 3.15 wheels yet; its pure-Python build needs no compiler.
[tool.uv.extra-build-variables]
pyyaml = { PYYAML_FORCE_LIBYAML = "0" }

[tool.pytest]
minversion = "9.1"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-q", "-ra", "--tb=short"]
strict = true
filterwarnings = [
    "error",
    # Starlette's TestClient still annotates with the alias AnyIO deprecated.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.coverage.run]
source = ["src/overture"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
# Keep a small margin below the full suite's measured coverage.
fail_under = 93
# Protocol and overload bodies are signatures only.
exclude_also = ['^\s*\.\.\.\s*$']

[tool.coverage.html]
directory = "htmlcov"

[tool.pyright]
include = ["src", "tests"]
exclude = [
    "**/.*",
    "**/__pycache__",
    "**/node_modules",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
]
pythonVersion = "3.15"
pythonPlatform = "All"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
strictListInference = true
strictDictionaryInference = true
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"
# Require explicit types at service injection boundaries.
reportMissingParameterType = "error"

# Test doubles are deliberately loose about the arguments they ignore; the rule
# above exists to protect the production injection seam.
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = [".", "src"]
reportMissingParameterType = "none"

[tool.ruff]
target-version = "py315"
line-length = 88
indent-width = 4
extend-exclude = ["frontend", ".agents", ".claude"]

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins: prevent shadowing Python built-ins
    "ASYNC",  # flake8-async: async/await hazard detection
    "B",      # flake8-bugbear: common bugs, anti-patterns, and design flaws
    "C4",     # flake8-comprehensions: optimal list/set/dict comprehension syntax
    "C90",    # mccabe: cyclomatic complexity check
    "DTZ",    # flake8-datetimez: enforce timezone-aware datetimes
    "E",      # pycodestyle errors: core syntax and style checks
    "ERA",    # eradicate: identify and prevent commented-out dead code
    "EXE",    # flake8-executable: validate executable bits and shebang lines
    "F",      # Pyflakes: core undefined symbols, imports, and syntax checks
    "FAST",   # FastAPI: FastAPI-specific route and dependency validation
    "FLY",    # flynt: encourage modern f-strings over string joins
    "FURB",   # refurb: modernise Python idioms for current language standards
    "G",      # flake8-logging-format: validate logging format arguments
    "I",      # isort: deterministic and clean import ordering
    "ICN",    # flake8-import-conventions: enforce standard import conventions
    "INP",    # flake8-no-pep420: forbid implicit namespace packages (require __init__.py)
    "ISC",    # flake8-implicit-str-concat: catch accidental string concatenation bugs
    "LOG",    # flake8-logging: logging anti-patterns and performance
    "N",      # pep8-naming: PEP 8 naming convention enforcement
    "PERF",   # Perflint: performance anti-patterns and redundant iterations
    "PGH",    # pygrep-hooks: require explicit rule codes on ignore comments
    "PIE",    # flake8-pie: miscellaneous code quality improvements
    "PL",     # Pylint: comprehensive linting (PLC, PLE, PLR, PLW) including non-ASCII checks
    "PT",     # flake8-pytest-style: pytest conventions, assertions, and fixtures
    "PTH",    # flake8-use-pathlib: modern pathlib usage instead of os.path
    "RET",    # flake8-return: return statement clarity and anti-patterns
    "RSE",    # flake8-raise: raise statement improvements
    "RUF",    # Ruff-specific: modern Python checks, ambiguous Unicode, and unused noqa
    "S",      # flake8-bandit: automated security issue detection
    "SIM",    # flake8-simplify: code simplification and dead branch elimination
    "SLF",    # flake8-self: discourage private member access across boundaries
    "SLOT",   # flake8-slots: enforce __slots__ where appropriate
    "T10",    # flake8-debugger: forbid stray debugger calls (breakpoint, pdb)
    "T20",    # flake8-print: forbid stray print statements in backend runtime code
    "TC",     # flake8-type-checking: enforce TYPE_CHECKING blocks for type-only imports
    "TID",    # flake8-tidy-imports: clean and tidy import boundaries
    "UP",     # pyupgrade: automate Python 3.15 syntax upgrades
    "W",      # pycodestyle warnings: standard style warnings
    "YTT",    # flake8-2020: catch sys.version misuses
]

ignore = [
    "TID252",  # relative-parent-imports: allowed because the package uses modular relative imports across domain packages
    "PLR0911", # too-many-return-statements: complex validation and decision trees use multiple return guards
    "PLR0913", # too-many-arguments: FastAPI route handlers and service dependencies routinely require >5 injected parameters
    "PLR0915", # too-many-statements: covered by McCabe cyclomatic complexity limit (max-complexity = 12)
    "PLR0917", # too-many-positional-arguments: redundant duplicate of PLR0913 for modern Python functions
    "PLR2004", # magic-value-comparison: flagging standard HTTP status codes (200, 404) and timeouts creates noisy constants
]


[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# Tests use assertions for validation, frequently use dummy credentials, and are not an installed package.
"tests/**" = ["S101", "S105", "S106", "INP001"]
# Command-line tools report status directly to stdout/stderr and run external processes.
"scripts/*.py" = ["T201", "S101", "S310", "S603"]
# The native packager runs build tools from PATH inside the image build.
"packaging/linux/build.py" = ["INP001", "T201", "S603", "S607"]
# Autogenerated by `alembic revision --autogenerate` from Alembic's own template.
"src/overture/migrations/versions/*.py" = ["TC003", "TID254", "INP001"]
# The command reports to the terminal and runs the fixed theme tools in its checks.
"src/overture/cli.py" = ["S603", "T201"]
# Importing the models is what registers their tables on the shared metadata.
"src/overture/db/__init__.py" = ["TID254"]
# Relationship targets stay quoted for SQLAlchemy to resolve by name: evaluating
# them would import the mutually referencing models while they are being defined.
"src/overture/db/models/*.py" = ["UP037", "UP045"]

[tool.ruff.lint.flake8-tidy-imports]
# Every module-level import is deferred to first use (PEP 810), which also makes
# TYPE_CHECKING blocks unnecessary: an import used only in annotations never loads.
require-lazy = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = "dynamic"
