  <g fill="none" stroke-width="2.3">
    <rect x="9" y="9" width="46" height="46" rx="8.8" class="tone-0" />
    <rect x="14" y="14" width="36" height="36" rx="7" class="tone-1" />
    <rect x="19" y="19" width="26" height="26" rx="5.2" class="tone-2" />
