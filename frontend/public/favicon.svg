<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <style>
    :root {
      color: #292b31;
    }
    .tone-0 {
      stroke: #626a76;
    }
    .tone-1 {
      stroke: #746e62;
    }
    .tone-2 {
      stroke: #806844;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color: #d8c7a3;
      }
      .tone-0 {
        stroke: #9ca1aa;
      }
      .tone-1 {
        stroke: #bdb7ab;
      }
      .tone-2 {
        stroke: #d8c7a3;
      }
    }
  </style>
  <svg
    x="0"
    y="0"
    width="16"
    height="16"
    preserveAspectRatio="xMidYMid meet"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 16 16"
  >
    <g
      transform="translate(8 8)"
      fill="none"
      stroke-width="1.25"
      stroke-linejoin="round"
      shape-rendering="geometricPrecision"
    >
      <rect x="-7.375" y="-7.375" width="14.75" height="14.75" rx="3.5" class="tone-0" />
      <rect x="-4.875" y="-4.875" width="9.75" height="9.75" rx="2.5" class="tone-1" />
      <rect x="-2.375" y="-2.375" width="4.75" height="4.75" rx="1.5" class="tone-2" />
    </g>
  </svg>
</svg>
