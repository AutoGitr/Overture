name: CodeQL

on:
  pull_request:
    paths:
      - src/**
      - scripts/**
      - packaging/**/*.py
      - frontend/src/**
      - "!frontend/src/test/**"
      - "!frontend/src/generated/**"
      - frontend/scripts/**
      - frontend/*.ts
      - frontend/*.js
      - frontend/*.mjs
      - frontend/*.cjs
      - .github/workflows/**
      - .github/codeql/**
  push:
    branches: [main]
    paths:
      - src/**
      - scripts/**
      - packaging/**/*.py
      - frontend/src/**
      - "!frontend/src/test/**"
      - "!frontend/src/generated/**"
      - frontend/scripts/**
      - frontend/*.ts
      - frontend/*.js
      - frontend/*.mjs
      - frontend/*.cjs
      - .github/workflows/**
      - .github/codeql/**
  schedule:
    # Offset from the Trivy and Renovate schedules.
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/codeql-analysis.yml
    with:
      languages: '["python", "javascript-typescript", "actions"]'
