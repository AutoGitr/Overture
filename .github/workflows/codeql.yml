name: CodeQL

on:
  pull_request:
    paths:
      - src/**
      - scripts/**
      - packaging/**/*.py
      - frontend/src/**
      - "!frontend/src/test/**"
      - "!frontend/src/generated/**"
      - frontend/scripts/**
      - frontend/*.ts
      - frontend/*.js
      - frontend/*.mjs
      - frontend/*.cjs
      - .github/workflows/**
      - .github/codeql/**
  push:
    branches: [main]
    paths:
      - src/**
      - scripts/**
      - packaging/**/*.py
      - frontend/src/**
      - "!frontend/src/test/**"
      - "!frontend/src/generated/**"
      - frontend/scripts/**
      - frontend/*.ts
      - frontend/*.js
      - frontend/*.mjs
      - frontend/*.cjs
      - .github/workflows/**
      - .github/codeql/**
  schedule:
    # Offset from the Trivy and Renovate schedules.
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
