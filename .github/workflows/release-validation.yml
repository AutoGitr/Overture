name: Release validation

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate
        required: false
        type: string

concurrency:
  group: release-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-capacity-and-soak:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      OVERTURE_CATALOG_BUDGET_SECONDS: 60
      OVERTURE_CATALOG_CAPACITY_ITEMS: 10000
      OVERTURE_SNAPSHOT_CAPACITY_JOBS: 10000
      OVERTURE_SOAK_ROUNDS: 250
      OVERTURE_SYNC_BUDGET_SECONDS: 120
      OVERTURE_SYNC_CAPACITY_ITEMS: 5000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"

      - name: Install backend dependencies
        run: uv sync --locked --group dev

      - name: Run capacity, restore, cancellation, reconnect, and concurrency tests
        run: uv run --locked pytest tests/test_release -q

  frontend-capacity:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run the large-library interaction budget on desktop and mobile
        run: |
          bun run build
          bunx playwright test --grep "ten-thousand-item library stays virtualized and interactive"
