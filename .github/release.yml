changelog:
  exclude:
    labels:
      - ci
      - test
  categories:
    - title: Security
      labels:
        - security
    - title: Features
      labels:
        - feat
    - title: Fixes
      labels:
        - bug
    - title: Refactoring
      labels:
        - refactor
    - title: Documentation
      labels:
        - docs
    - title: Dependencies
      labels:
        - deps
    - title: Changes
      labels:
        - "*"
